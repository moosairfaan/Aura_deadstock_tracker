# Blueprint: deploy from repository root (leave Render "Root Directory" empty).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aura-fashion-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
